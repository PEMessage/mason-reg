---
name: arkts-lsp
description: |
  One-click standalone ArkTS / ArkUI language server. Wraps DevEco Studio's ace-server with the upstream
  arkts-lsp-proxy and requires the official HarmonyOS command-line tools to be available on PATH.
homepage: https://github.com/PEMessage/arkts-lsp
licenses:
  - MIT
languages:
  - ArkTS
categories:
  - LSP

source:
  # arkts-lsp is not published to npm; the launcher (bundling the ace-server build and the vendored
  # arkts-lsp-proxy) is only distributed through the unversioned `nightly` GitHub release. Installing the tarball
  # through npm also resolves its `json5` and `vscode-jsonrpc` runtime dependencies, which the launcher requires
  # at startup.
  id: pkg:generic/PEMessage/arkts-lsp@nightly
  build:
    run: npm install --no-audit https://github.com/PEMessage/arkts-lsp/releases/download/nightly/arkts-lsp.tgz

bin:
  arkts-lsp: npm:arkts-lsp
